services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.shielddev.com.ar
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.shielddev.com.ar/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=9tUB04YgF6Fp
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

